<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 38 38" fill="none">
  <!-- Dark Obsidian Background for Browser Tabs -->
  <rect width="38" height="38" rx="0" fill="#121824"/>

  <defs>
    <mask id="favicon-pulse-mask" maskUnits="userSpaceOnUse" x="0" y="0" width="38" height="38">
      <rect width="38" height="38" fill="#FFFFFF"/>
      <path d="M 11.2 16.5 C 14.5 19.5, 16.5 22.0, 18.5 20.5 C 20.5 19.0, 21.8 18.8, 27.0 21.8"
            stroke="#000000" stroke-width="1.9" stroke-linecap="round" fill="none"/>
    </mask>
  </defs>

  <!-- Sharp Square Frame -->
  <rect x="1" y="1" width="36" height="36" rx="0" fill="none" stroke="#F59E0B" stroke-width="1.5"/>

  <!-- Ergonomic Telephone Receiver + 5-Bar Acoustic Pulse -->
  <g transform="translate(2.2, 0)" mask="url(#favicon-pulse-mask)">
    <!-- Bar 1: Curved Outer Spine of Telephone Receiver (#F9E7B9 Butter Yellow) -->
    <path d="M 7.5 10.1 Q 7.5 7.5, 10.1 7.5 L 10.1 22.5 C 8.5 21.5, 7.5 20.2, 7.5 18.5 Z" fill="#F9E7B9"/>

    <!-- Bar 2: Earpiece Pad, Slender Handle & Microphone Pad (#F9E7B9 Butter Yellow) -->
    <path d="M 11.5 7.5 L 12.6 7.5 Q 14.1 7.5, 14.1 9.0 L 14.1 13.3 Q 14.1 14.5, 12.9 14.5 L 12.9 20.5 Q 14.1 20.5, 14.1 21.8 L 14.1 27.2 Q 12.6 26.8, 11.5 25.4 Z" fill="#F9E7B9"/>

    <!-- Bars 3, 4, 5: 3 Ascending Acoustic Voice Bars (#F59E0B Rich Amber Gold) -->
    <path d="M 15.5 14.5 Q 15.5 13.5, 16.8 13.5 Q 18.1 13.5, 18.1 14.5 L 18.1 29.2 Q 16.8 28.8, 15.5 28.2 Z" fill="#F59E0B"/>
    <path d="M 19.5 11.5 Q 19.5 10.5, 20.8 10.5 Q 22.1 10.5, 22.1 11.5 L 22.1 30.5 Q 20.8 30.2, 19.5 29.7 Z" fill="#F59E0B"/>
    <path d="M 23.5 8.8 Q 23.5 7.5, 24.8 7.5 Q 26.1 7.5, 26.1 8.8 L 26.1 29.5 Q 26.1 31.0, 23.5 30.8 Z" fill="#F59E0B"/>
  </g>
</svg>
