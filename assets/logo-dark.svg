<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 184 38" fill="none" role="img" aria-label="milAI24 Logo">
  <defs>
    <mask id="acoustic-pulse-mask-dark" maskUnits="userSpaceOnUse" x="0" y="0" width="38" height="38">
      <rect width="38" height="38" fill="#FFFFFF"/>
      <path d="M 11.2 16.5 C 14.5 19.5, 16.5 22.0, 18.5 20.5 C 20.5 19.0, 21.8 18.8, 27.0 21.8"
            stroke="#000000" stroke-width="1.9" stroke-linecap="round" fill="none"/>
    </mask>
  </defs>

  <!-- Sharp Square Frame (High-Contrast Amber) -->
  <rect x="1" y="1" width="36" height="36" rx="0" fill="none" stroke="#D97706" stroke-width="1.5"/>

  <!-- Ergonomic Telephone Receiver + 5-Bar Acoustic Pulse -->
  <g transform="translate(2.2, 0)" mask="url(#acoustic-pulse-mask-dark)">
    <!-- Bar 1: Curved Outer Spine of Telephone Receiver (#121824) -->
    <path d="M 7.5 10.1 Q 7.5 7.5, 10.1 7.5 L 10.1 22.5 C 8.5 21.5, 7.5 20.2, 7.5 18.5 Z" fill="#121824"/>

    <!-- Bar 2: Earpiece Pad, Slender Handle & Microphone Pad (#121824) -->
    <path d="M 11.5 7.5 L 12.6 7.5 Q 14.1 7.5, 14.1 9.0 L 14.1 13.3 Q 14.1 14.5, 12.9 14.5 L 12.9 20.5 Q 14.1 20.5, 14.1 21.8 L 14.1 27.2 Q 12.6 26.8, 11.5 25.4 Z" fill="#121824"/>

    <!-- Bars 3, 4, 5: 3 Ascending Acoustic Voice Bars (#D97706) -->
    <path d="M 15.5 14.5 Q 15.5 13.5, 16.8 13.5 Q 18.1 13.5, 18.1 14.5 L 18.1 29.2 Q 16.8 28.8, 15.5 28.2 Z" fill="#D97706"/>
    <path d="M 19.5 11.5 Q 19.5 10.5, 20.8 10.5 Q 22.1 10.5, 22.1 11.5 L 22.1 30.5 Q 20.8 30.2, 19.5 29.7 Z" fill="#D97706"/>
    <path d="M 23.5 8.8 Q 23.5 7.5, 24.8 7.5 Q 26.1 7.5, 26.1 8.8 L 26.1 29.5 Q 26.1 31.0, 23.5 30.8 Z" fill="#D97706"/>
  </g>

  <!-- Typography: mil [Deep Obsidian #121824] + AI24 [Rich Amber Gold #F59E0B] + .gr [Slate #64748B] -->
  <text x="47" y="27" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="25" letter-spacing="-0.5">
    <tspan fill="#121824" font-weight="600">mil</tspan><tspan fill="#F59E0B" font-weight="800">AI24</tspan><tspan fill="#64748B" font-size="18" font-weight="500">.gr</tspan>
  </text>
</svg>
